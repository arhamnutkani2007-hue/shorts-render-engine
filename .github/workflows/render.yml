name: Render Minecraft Shorts (FFmpeg Engine, $0 cost)

on:
  repository_dispatch:
    types: [render_video]

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      AUDIO_URL: ${{ github.event.client_payload.audio_url }}
      VIDEO_URL: ${{ github.event.client_payload.video_url }}
      START_TIME: ${{ github.event.client_payload.start_time }}
      DURATION: ${{ github.event.client_payload.duration }}
      CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
      REDDIT_ID: ${{ github.event.client_payload.reddit_id }}
      VIDEO_TITLE: ${{ github.event.client_payload.title }}
      VIDEO_DESCRIPTION: ${{ github.event.client_payload.description }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate inputs from n8n
        run: |
          echo "Checking client_payload fields sent by n8n..."
          MISSING=0

          check() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "::error::Missing/empty client_payload.$name — check the n8n 'Trigger GitHub Action' node body."
              MISSING=1
            else
              echo "OK: $name is present"
            fi
          }

          check "audio_url" "$AUDIO_URL"
          check "video_url" "$VIDEO_URL"
          check "start_time" "$START_TIME"
          check "duration" "$DURATION"
          check "callback_url" "$CALLBACK_URL"

          if [ "$MISSING" = "1" ]; then
            echo "::error::One or more required fields from n8n are empty. Fix the n8n trigger node payload and re-run. Stopping now instead of failing deep inside the job."
            exit 1
          fi

      - name: Install FFmpeg & Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl jq python3-pip
          pip install --break-system-packages google-auth google-auth-oauthlib google-api-python-client requests

      - name: Download voice audio
        run: |
          python3 -c "
          import requests, os, sys
          url = os.environ.get('AUDIO_URL', '')
          if not url:
              print('AUDIO_URL is empty - cannot download audio', file=sys.stderr)
              sys.exit(1)
          try:
              resp = requests.get(url, timeout=60)
              resp.raise_for_status()
          except requests.exceptions.HTTPError as e:
              print(f'Download failed: {e}', file=sys.stderr)
              print(f'Response body: {resp.text[:1000]}', file=sys.stderr)
              print(f'Response headers: {dict(resp.headers)}', file=sys.stderr)
              sys.exit(1)
          with open('audio.mp3', 'wb') as f:
              f.write(resp.content)
          print(f'Downloaded audio.mp3 successfully ({len(resp.content)} bytes)')
          "

      - name: Cut Minecraft clip (cached full video, then trim locally)
        run: |
          curl -L "$VIDEO_URL" -o source.mp4

          # Sanity check: a real Minecraft clip source should be at least a few MB.
          SIZE=$(stat -c%s source.mp4 2>/dev/null || echo 0)
          echo "Downloaded source.mp4 size: $SIZE bytes"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::source.mp4 is only $SIZE bytes - download likely failed. Check VIDEO_URL points to a valid GitHub Release asset."
            head -c 500 source.mp4
            exit 1
          fi

          # Get the real duration of the source video so we can catch an out-of-range start_time
          # BEFORE ffmpeg silently produces an empty clip.
          VIDEO_DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 source.mp4)
          VIDEO_DURATION_INT=${VIDEO_DURATION%.*}
          echo "Source video duration: ${VIDEO_DURATION_INT}s | requested start_time=${START_TIME}s duration=${DURATION}s"

          if [ -z "$VIDEO_DURATION_INT" ] || [ "$START_TIME" -ge "$VIDEO_DURATION_INT" ]; then
            echo "::error::start_time ($START_TIME s) is beyond the source video's actual length (${VIDEO_DURATION_INT}s)."
            echo "::error::Fix the 'Pick Random Start Point (No Repeats)' node in n8n - its max range must match this video's real duration (${VIDEO_DURATION_INT}s), not the old video's length."
            exit 1
          fi

          ffmpeg -ss "$START_TIME" \
                 -i source.mp4 \
                 -t "$DURATION" \
                 -c:v libx264 -preset veryfast -c:a copy raw_clip.mp4
          rm source.mp4

          # Confirm the cut actually produced a real video stream (catches silent empty-clip cases)
          CLIP_DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 raw_clip.mp4 2>/dev/null || echo "")
          echo "raw_clip.mp4 duration: ${CLIP_DURATION}s"
          if [ -z "$CLIP_DURATION" ]; then
            echo "::error::raw_clip.mp4 has no readable duration/streams - the cut produced an empty file."
            exit 1
          fi

      - name: Build word-synced subtitle file (.ass) from AssemblyAI words JSON
        run: |
          cat > build_subs.py << 'EOF'
          import json, sys
          words = json.loads('''${{ toJson(github.event.client_payload.words) }}''')
          def ts(ms):
              t = ms / 1000
              h = int(t // 3600); m = int((t % 3600) // 60); s = t % 60
              return f"{h}:{m:02d}:{s:05.2f}"
          header = """[Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, OutlineColour, Bold, Outline, Shadow, Alignment, MarginV
          Style: Word,Arial Black,90,&H00FFFFFF,&H00000000,1,4,0,2,300

          [Events]
          Format: Layer, Start, End, Style, Text
          """
          lines = [header]
          for w in words:
              lines.append(f"Dialogue: 0,{ts(w['start'])},{ts(w['end'])},Word,{w['text'].upper()}")
          open("subs.ass", "w", encoding="utf-8").write("\n".join(lines))
          EOF
          python3 build_subs.py

      - name: Composite final video (crop 9:16 + voice + burned subtitles)
        run: |
          ffmpeg -i raw_clip.mp4 -i audio.mp3 \
                 -filter_complex "[0:v]crop=ih*(9/16):ih,scale=1080:1920,ass=subs.ass[v];[1:a]volume=1.0[a]" \
                 -map "[v]" -map "[a]" \
                 -c:v libx264 -preset fast -crf 22 -c:a aac -b:a 192k -shortest \
                 final_output.mp4

      - name: Upload to YouTube
        id: youtube_upload
        env:
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          cat > upload_youtube.py << 'EOF'
          import os, json
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          creds = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              token_uri="https://oauth2.googleapis.com/token",
          )
          youtube = build("youtube", "v3", credentials=creds)

          body = {
              "snippet": {
                  "title": os.environ.get("VIDEO_TITLE", "Untitled"),
                  "description": os.environ.get("VIDEO_DESCRIPTION", ""),
                  "categoryId": "24",
              },
              "status": {"privacyStatus": "public"},
          }
          media = MediaFileUpload("final_output.mp4", chunksize=-1, resumable=True)
          request = youtube.videos().insert(part="snippet,status", body=body, media_body=media)
          response = request.execute()
          print(json.dumps({"youtube_id": response["id"]}))
          with open("youtube_result.json", "w") as f:
              json.dump({"youtube_id": response["id"]}, f)
          EOF
          python3 upload_youtube.py

      - name: Notify n8n (callback)
        if: always()
        run: |
          STATUS="failed"
          YT_ID=""
          if [ -f youtube_result.json ]; then
            STATUS="success"
            YT_ID=$(jq -r '.youtube_id' youtube_result.json)
          fi

          # Safe defaults so arithmetic / JSON never breaks even if inputs were missing
          SAFE_START="${START_TIME:-0}"
          SAFE_DURATION="${DURATION:-0}"
          CLIP_END=$(( SAFE_START + SAFE_DURATION ))

          PAYLOAD=$(jq -n \
            --arg status "$STATUS" \
            --arg reddit_id "$REDDIT_ID" \
            --arg youtube_id "$YT_ID" \
            --argjson clip_start "$SAFE_START" \
            --argjson clip_end "$CLIP_END" \
            '{status: $status, reddit_id: $reddit_id, youtube_id: $youtube_id, clip_start: $clip_start, clip_end: $clip_end}')

          echo "Sending callback payload: $PAYLOAD"

          curl -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
