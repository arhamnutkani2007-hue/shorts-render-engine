name: Render Minecraft Shorts (FFmpeg Engine, $0 cost)

on:
  repository_dispatch:
    types: [render_video]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl jq python3-pip
          pip install --break-system-packages google-auth google-auth-oauthlib google-api-python-client

      - name: Download voice audio
        run: |
          python3 -c "import urllib.request; urllib.request.urlretrieve('${{ github.event.client_payload.audio_url }}', 'audio.mp3')"

      - name: Cut Minecraft clip (cached full video, then trim locally)
        run: |
          curl -L "${{ github.event.client_payload.video_url }}" -o source.mp4
          ffmpeg -ss ${{ github.event.client_payload.start_time }} \
                 -i source.mp4 \
                 -t ${{ github.event.client_payload.duration }} \
                 -c:v libx264 -preset veryfast -c:a copy raw_clip.mp4
          rm source.mp4

      - name: Build word-synced subtitle file (.ass) from AssemblyAI words JSON
        run: |
          cat > build_subs.py << 'EOF'
          import json, sys
          words = json.loads('''${{ toJson(github.event.client_payload.words) }}''')
          def ts(ms):
              t = ms / 1000
              h = int(t // 3600); m = int((t % 3600) // 60); s = t % 60
              return f"{h}:{m:02d}:{s:05.2f}"
          header = """[Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, OutlineColour, Bold, Outline, Shadow, Alignment, MarginV
          Style: Word,Arial Black,90,&H00FFFFFF,&H00000000,1,4,0,2,300

          [Events]
          Format: Layer, Start, End, Style, Text
          """
          lines = [header]
          for w in words:
              lines.append(f"Dialogue: 0,{ts(w['start'])},{ts(w['end'])},Word,{w['text'].upper()}")
          open("subs.ass", "w", encoding="utf-8").write("\n".join(lines))
          EOF
          python3 build_subs.py

      - name: Composite final video (crop 9:16 + voice + burned subtitles)
        run: |
          ffmpeg -i raw_clip.mp4 -i audio.mp3 \
                 -filter_complex "[0:v]crop=ih*(9/16):ih,scale=1080:1920,ass=subs.ass[v];[1:a]volume=1.0[a]" \
                 -map "[v]" -map "[a]" \
                 -c:v libx264 -preset fast -crf 22 -c:a aac -b:a 192k -shortest \
                 final_output.mp4

      - name: Upload to YouTube
        id: youtube_upload
        env:
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          VIDEO_TITLE: ${{ github.event.client_payload.title }}
          VIDEO_DESCRIPTION: ${{ github.event.client_payload.description }}
        run: |
          cat > upload_youtube.py << 'EOF'
          import os, json
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          creds = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              token_uri="https://oauth2.googleapis.com/token",
          )
          youtube = build("youtube", "v3", credentials=creds)

          body = {
              "snippet": {
                  "title": os.environ["VIDEO_TITLE"],
                  "description": os.environ["VIDEO_DESCRIPTION"],
                  "categoryId": "24",
              },
              "status": {"privacyStatus": "private"},
          }
          media = MediaFileUpload("final_output.mp4", chunksize=-1, resumable=True)
          request = youtube.videos().insert(part="snippet,status", body=body, media_body=media)
          response = request.execute()
          print(json.dumps({"youtube_id": response["id"]}))
          with open("youtube_result.json", "w") as f:
              json.dump({"youtube_id": response["id"]}, f)
          EOF
          python3 upload_youtube.py

      - name: Notify n8n (callback)
        if: always()
        run: |
          STATUS="failed"
          YT_ID=""
          if [ -f youtube_result.json ]; then
            STATUS="success"
            YT_ID=$(jq -r '.youtube_id' youtube_result.json)
          fi
          curl -X POST "${{ github.event.client_payload.callback_url }}" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"$STATUS\",\"reddit_id\":\"${{ github.event.client_payload.reddit_id }}\",\"youtube_id\":\"$YT_ID\",\"clip_start\":${{ github.event.client_payload.start_time }},\"clip_end\":$((${{ github.event.client_payload.start_time }} + ${{ github.event.client_payload.duration }}))}"
